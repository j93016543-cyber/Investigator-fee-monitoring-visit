<title>TTK-CS-101 연구비 · 모니터링 트래커</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  color-scheme: light;
  --ground:#eef2f3; --surface:#ffffff; --surface-2:#f5f8f9; --surface-3:#eaeff1;
  --line:#dbe3e5; --line-strong:#c3cfd2;
  --ink:#132022; --ink-2:#43585c; --ink-3:#6d8388;
  --accent:#0d7680; --accent-ink:#0a5d66; --accent-wash:#e2f0f1;
  --good:#0f7a53; --good-wash:#e0f0e9;
  --warn:#b7791f; --warn-wash:#fbeecf;
  --crit:#c0392b; --crit-wash:#f9e3df;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --shadow:0 1px 2px rgba(19,32,34,.05),0 2px 12px rgba(19,32,34,.05);
  --radius:12px;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --ground:#0c1315; --surface:#141d20; --surface-2:#1a2529; --surface-3:#222f33;
  --line:#26343a; --line-strong:#35474e;
  --ink:#eaf1f2; --ink-2:#a7bcc1; --ink-3:#7690967;
  --ink-3:#78909a;
  --accent:#3fb2bd; --accent-ink:#6fcdd6; --accent-wash:#16302f;
  --good:#3fb48a; --good-wash:#122b23; --warn:#e0a83c; --warn-wash:#2e2716;
  --crit:#e5705f; --crit-wash:#301c19;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 14px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0c1315; --surface:#141d20; --surface-2:#1a2529; --surface-3:#222f33;
  --line:#26343a; --line-strong:#35474e;
  --ink:#eaf1f2; --ink-2:#a7bcc1; --ink-3:#78909a;
  --accent:#3fb2bd; --accent-ink:#6fcdd6; --accent-wash:#16302f;
  --good:#3fb48a; --good-wash:#122b23; --warn:#e0a83c; --warn-wash:#2e2716;
  --crit:#e5705f; --crit-wash:#301c19;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:650}
a{color:var(--accent-ink)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand h1{font-size:18px;letter-spacing:-.01em}
.brand .sub{color:var(--ink-3);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  background:var(--accent-wash);color:var(--accent-ink);font-size:11.5px;font-weight:600;
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* tabs */
.tabs{display:flex;gap:4px;padding:14px 20px 0;max-width:1240px;margin:0 auto}
.tab{appearance:none;border:1px solid transparent;border-bottom:none;background:transparent;
  color:var(--ink-3);font-family:inherit;font-size:14px;font-weight:600;padding:10px 18px;
  border-radius:10px 10px 0 0;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);
  box-shadow:0 -2px 0 var(--accent) inset}
.tab:hover:not([aria-selected="true"]){color:var(--ink-2)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.kpi .lab{color:var(--ink-3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:23px;font-weight:680;letter-spacing:-.02em}
.kpi .meta{font-size:12px;color:var(--ink-2)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.card>.head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card>.head .tag{font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:6px;letter-spacing:.03em}
.card>.head h2{font-size:16px}
.card>.head .desc{color:var(--ink-3);font-size:12.5px;margin-left:auto;text-align:right;max-width:52%}
.card>.body{padding:16px 18px}
.card>.body.flush{padding:0}

/* table */
.tbl-scroll{overflow-x:auto}
.tbl-scroll.tall{max-height:460px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:650;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tbody tr:hover{background:var(--surface-2)}
tr.sec td{background:var(--surface-3);font-weight:700;color:var(--ink);text-transform:none;font-size:12.5px}
tr.sub td{background:var(--surface-2);font-weight:650;color:var(--ink-2)}
tr.subtotal td{font-weight:700;border-top:1px solid var(--line-strong)}
tr.total td{font-weight:750;background:var(--surface-2);border-top:2px solid var(--line-strong)}
tr.eff{outline:2px solid var(--accent);outline-offset:-2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:650;border:1px solid transparent}
.chip.good{background:var(--good-wash);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.chip.warn{background:var(--warn-wash);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.chip.crit{background:var(--crit-wash);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.chip.mute{background:var(--surface-3);color:var(--ink-3)}
.chip.acc{background:var(--accent-wash);color:var(--accent-ink)}
td.shade-good{background:var(--good-wash)}
td.shade-warn{background:var(--warn-wash)}
td.shade-crit{background:var(--crit-wash)}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px;margin-right:5px}

/* legend / controls */
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
select,input[type=search]{font-family:inherit;font-size:13px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line-strong);
  border-radius:10px;padding:12px 14px;display:flex;gap:10px}
.note b{color:var(--ink)}
.pending{border-left:3px solid var(--warn)}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.card>.head .desc{max-width:100%;text-align:left;margin-left:0}}
.svg-wrap{overflow-x:auto}
svg .grid line{stroke:var(--line)}
svg text{fill:var(--ink-2);font-family:var(--sans)}
.tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);
  padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:var(--shadow);
  opacity:0;transition:opacity .1s;z-index:50;max-width:260px}
.tooltip .tt-t{font-weight:700;margin-bottom:2px}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px}
.hide{display:none!important}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
h3.subh{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 10px}
</style>

<header>
  <div class="hbar">
    <div class="brand">
      <h1>TTK-CS-101 · 연구비 &amp; 모니터링 누적 트래커</h1>
      <div class="sub" id="sub"></div>
    </div>
    <span class="badge" id="effBadge"></span>
    <button class="icon-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">◐</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-fee" aria-selected="true" aria-controls="panel-fee">💰 연구비 (Research Fees)</button>
    <button class="tab" role="tab" id="tab-mon" aria-selected="false" aria-controls="panel-mon">🔍 모니터링 (Monitoring)</button>
  </div>
</header>

<main class="wrap">
  <section id="panel-fee" role="tabpanel"></section>
  <section id="panel-mon" role="tabpanel" class="hide"></section>
  <div class="foot" id="foot"></div>
</main>
<div class="tooltip" id="tt"></div>
